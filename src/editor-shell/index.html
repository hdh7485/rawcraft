<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RawCraft Editor Shell</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">RawCraft</p>
        <h1>Interactive Editor Shell</h1>
        <p class="hero-copy">
          One active asset, one committed edit lineage, and the real preview and
          mutation runtime behind every action.
        </p>
        <div class="hero-actions">
          <button id="refresh-preview" class="primary-action" type="button">
            Refresh Preview
          </button>
          <button id="simulate-conflict" class="secondary-action" type="button">
            Simulate Conflict
          </button>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel viewport-panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Preview</p>
              <h2>Active Asset Viewport</h2>
            </div>
            <div id="preview-badges" class="badge-row"></div>
          </div>
          <div id="preview-frame" class="preview-frame"></div>
          <div id="preview-meta" class="preview-meta"></div>
        </section>

        <section class="panel status-panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Runtime</p>
              <h2>Session State</h2>
            </div>
          </div>
          <div id="status-summary" class="status-summary"></div>
          <div id="operation-summary" class="operation-summary"></div>
        </section>

        <section class="panel controls-panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Controls</p>
              <h2>Global Adjustments</h2>
            </div>
          </div>
          <div id="controls-grid" class="controls-grid"></div>
        </section>

        <section class="panel batch-panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Batch Apply</p>
              <h2>Preset Propagation</h2>
            </div>
          </div>
          <div id="batch-source-summary"></div>
          <div id="batch-selection-summary" class="batch-selection-summary"></div>
          <form id="batch-apply-form" class="batch-form">
            <label class="batch-mode-field">
              <span class="meta-label">Apply Mode</span>
              <select id="batch-apply-mode"></select>
            </label>
            <div class="batch-actions">
              <button id="batch-clear-selection" class="secondary-action" type="button">
                Clear Selection
              </button>
              <button id="batch-apply" class="primary-action" type="submit">
                Apply to 0 Targets
              </button>
            </div>
          </form>
          <div id="batch-target-list" class="batch-target-list"></div>
          <div id="batch-results" class="batch-results"></div>
        </section>

        <section class="panel history-panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">History</p>
              <h2>Committed Events</h2>
            </div>
          </div>
          <ol id="history-list" class="history-list"></ol>
        </section>
      </main>
    </div>

    <template id="control-card-template">
      <form class="control-card">
        <div class="control-header">
          <label class="control-title"></label>
          <output class="control-value"></output>
        </div>
        <input class="control-range" type="range" />
        <div class="control-footer">
          <input class="control-input" type="number" />
          <button class="control-button" type="submit">Commit</button>
        </div>
      </form>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
